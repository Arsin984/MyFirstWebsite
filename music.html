<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music | My City 984</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #111;
    color: white;
}

/* Header */
header {
    padding: 20px;
    text-align: center;
    background: linear-gradient(135deg, #111, #222);
    position: sticky;
    top: 0;
    z-index: 10;
}

header h1 {
    margin: 0 0 15px;
    font-size: 28px;
}

.search-box {
    width: 90%;
    max-width: 500px;
    padding: 13px 18px;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    outline: none;
}

/* Filter */
.filters {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 15px;
}

.filters button {
    border: none;
    padding: 10px 18px;
    border-radius: 25px;
    cursor: pointer;
    background: #333;
    color: white;
}

.filters button.active {
    background: #00c896;
}

/* Stories */
.stories {
    display: flex;
    gap: 20px;
    padding: 25px;
    overflow-x: auto;
    direction: rtl;
}

.story {
    flex: 0 0 auto;
    text-align: center;
    width: 120px;
}

.story-circle {
    width: 105px;
    height: 105px;
    margin: auto;
    border-radius: 50%;
    overflow: hidden;
    border: 4px solid #00c896;
    background: #222;
    position: relative;
    cursor: pointer;
}

.story-circle video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.story-circle .play {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 35px;
    background: rgba(0,0,0,0.25);
}

.story-name {
    margin-top: 8px;
    font-size: 14px;
}

/* Add music */
.add-story {
    width: 105px;
    height: 105px;
    border-radius: 50%;
    border: 4px dashed #00c896;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 45px;
    color: #00c896;
    cursor: pointer;
}

/* Music list */
.music-list {
    padding: 20px;
    max-width: 800px;
    margin: auto;
}

.music-card {
    background: #1e1e1e;
    margin-bottom: 15px;
    padding: 18px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    gap: 15px;
}

.music-card img {
    width: 70px;
    height: 70px;
    object-fit: cover;
    border-radius: 50%;
}

.music-info {
    flex: 1;
}

.music-info h3 {
    margin: 0 0 7px;
}

.music-info p {
    margin: 0;
    color: #aaa;
    font-size: 13px;
}

audio {
    width: 100%;
    margin-top: 10px;
}

/* Modal */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-box {
    background: #222;
    width: 100%;
    max-width: 450px;
    padding: 25px;
    border-radius: 25px;
}

.modal-box h2 {
    margin-top: 0;
}

.modal-box input {
    width: 100%;
    margin: 8px 0;
    padding: 12px;
    border-radius: 10px;
    border: none;
}

.modal-box button {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    border: none;
    border-radius: 25px;
    background: #00c896;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.close {
    background: #444 !important;
}

/* Mobile */
@media(max-width:600px) {

    header h1 {
        font-size: 23px;
    }

    .stories {
        gap: 15px;
        padding: 20px 15px;
    }

    .story {
        width: 95px;
    }

    .story-circle,
    .add-story {
        width: 85px;
        height: 85px;
    }

    .music-card {
        flex-direction: column;
        text-align: center;
    }
}
</style>
</head>

<body>

<header>
    <h1>🎵 Music</h1>

    <input
        type="text"
        id="search"
        class="search-box"
        placeholder="جستجوی آهنگ یا خواننده..."
        oninput="searchMusic()"
    >
</header>

<div class="filters">
    <button class="active" onclick="filterMusic('all', this)">همه</button>
    <button onclick="filterMusic('iranian', this)">ایرانی</button>
    <button onclick="filterMusic('foreign', this)">خارجی</button>
    <button onclick="filterMusic('new', this)">جدیدترین</button>
</div>

<!-- Story Music -->
<div class="stories" id="stories">

    <!-- Add Music -->
    <div class="story">
        <div class="add-story" onclick="openModal()">
            +
        </div>
        <div class="story-name">
            افزودن آهنگ
        </div>
    </div>

    <!-- Music Story Example -->
    <div class="story" data-name="آهنگ نمونه">

        <div class="story-circle" onclick="playStory(this)">

            <video muted loop playsinline>
                <source src="music-video.mp4" type="video/mp4">
            </video>

            <div class="play">
                ▶
            </div>

        </div>

        <div class="story-name">
            آهنگ نمونه
        </div>

    </div>

</div>

<!-- Music List -->
<section class="music-list" id="musicList">

    <div
        class="music-card"
        data-name="آهنگ نمونه"
        data-category="iranian"
    >

        <img src="cover.jpg" alt="cover">

        <div class="music-info">

            <h3>آهنگ نمونه</h3>

            <p>خواننده نمونه</p>

            <audio controls>
                <source src="music.mp3" type="audio/mpeg">
            </audio>

        </div>

    </div>

</section>

<!-- Add Music Modal -->
<div class="modal" id="musicModal">

    <div class="modal-box">

        <h2>🎵 افزودن آهنگ</h2>

        <input
            type="text"
            id="songName"
            placeholder="نام آهنگ"
        >

        <input
            type="text"
            id="artistName"
            placeholder="نام خواننده"
        >

        <label>فایل آهنگ:</label>
        <input
            type="file"
            id="audioFile"
            accept="audio/*"
        >

        <label>ویدیوی کوتاه:</label>
        <input
            type="file"
            id="videoFile"
            accept="video/*"
        >

        <button onclick="addMusic()">
            افزودن آهنگ
        </button>

        <button
            class="close"
            onclick="closeModal()"
        >
            بستن
        </button>

    </div>

</div>

<script>

let currentFilter = "all";

/* Open Modal */
function openModal() {
    document.getElementById("musicModal").style.display = "flex";
}

/* Close Modal */
function closeModal() {
    document.getElementById("musicModal").style.display = "none";
}

/* Play Story */
function playStory(element) {

    const video = element.querySelector("video");
    const play = element.querySelector(".play");

    if (video.paused) {
        video.play();
        play.style.display = "none";
    } else {
        video.pause();
        play.style.display = "flex";
    }
}

/* Add Music */
function addMusic() {

    const songName =
        document.getElementById("songName").value;

    const artistName =
        document.getElementById("artistName").value;

    const audioFile =
        document.getElementById("audioFile").files[0];

    const videoFile =
        document.getElementById("videoFile").files[0];

    if (!songName || !artistName || !audioFile) {
        alert("لطفاً نام آهنگ، خواننده و فایل آهنگ را انتخاب کنید.");
        return;
    }

    const audioURL =
        URL.createObjectURL(audioFile);

    const videoURL =
        videoFile
        ? URL.createObjectURL(videoFile)
        : "";

    /* Create Music Card */

    const card =
        document.createElement("div");

    card.className = "music-card";

    card.dataset.name =
        songName;

    card.dataset.category =
        "new";

    card.innerHTML = `

        <img
            src="cover.jpg"
            alt="cover"
        >

        <div class="music-info">

            <h3>${songName}</h3>

            <p>${artistName}</p>

            <audio controls>

                <source
                    src="${audioURL}"
                    type="${audioFile.type}"
                >

            </audio>

        </div>

    `;

    document
        .getElementById("musicList")
        .prepend(card);


    /* Create Story */

    if (videoURL) {

        const story =
            document.createElement("div");

        story.className =
            "story";

        story.dataset.name =
            songName;

        story.innerHTML = `

            <div
                class="story-circle"
                onclick="playStory(this)"
            >

                <video
                    muted
                    loop
                    playsinline
                >

                    <source
                        src="${videoURL}"
                        type="${videoFile.type}"
                    >

                </video>

                <div class="play">
                    ▶
                </div>

            </div>

            <div class="story-name">
                ${songName}
            </div>

        `;

        document
            .getElementById("stories")
            .appendChild(story);

    }

    closeModal();

    alert("آهنگ با موفقیت اضافه شد.");

}


/* Search */
function searchMusic() {

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    const cards =
        document
        .querySelectorAll(".music-card");

    cards.forEach(card => {

        const name =
            card.dataset.name
            .toLowerCase();

        if (name.includes(search)) {

            card.style.display =
                "flex";

        } else {

            card.style.display =
                "none";

        }

    });

}


/* Filter */
function filterMusic(category, button) {

    currentFilter =
        category;

    document
        .querySelectorAll(".filters button")
        .forEach(btn => {

            btn.classList.remove("active");

        });

    button.classList.add("active");

    const cards =
        document
        .querySelectorAll(".music-card");

    cards.forEach(card => {

        if (
            category === "all" ||
            card.dataset.category === category
        ) {

            card.style.display =
                "flex";

        } else {

            card.style.display =
                "none";

        }

    });

}

</script>

</body>
</html>
