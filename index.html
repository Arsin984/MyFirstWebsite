<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

html{
scroll-behavior:smooth;
}

body{

background:
radial-gradient(circle at top left,#4f46e5 0%,transparent 45%),
radial-gradient(circle at bottom right,#06b6d4 0%,transparent 40%),
#0f172a;

overflow-x:hidden;
color:white;

}

/* Loading */

#loader{

position:fixed;

inset:0;

background:#0f172a;

display:flex;

justify-content:center;

align-items:center;

z-index:99999;

transition:.8s;

}

.loader-circle{

width:90px;

height:90px;

border-radius:50%;

border:8px solid rgba(255,255,255,.08);

border-top:8px solid #7c3aed;

animation:spin 1s linear infinite;

}

@keyframes spin{

100%{

transform:rotate(360deg);

}

}

/* background */

.bg{

position:fixed;

inset:0;

overflow:hidden;

z-index:-2;

}

.blur{

position:absolute;

border-radius:50%;

filter:blur(120px);

opacity:.45;

animation:move 15s infinite alternate;

}

.blur:nth-child(1){

width:420px;

height:420px;

background:#7c3aed;

left:-120px;

top:-120px;

}

.blur:nth-child(2){

width:500px;

height:500px;

background:#06b6d4;

right:-180px;

bottom:-180px;

animation-delay:2s;

}

@keyframes move{

100%{

transform:translateY(120px)
translateX(80px);

}

}

/* NAV */

nav{

position:fixed;

top:20px;

left:50%;

transform:translateX(-50%);

width:95%;

max-width:1300px;

display:flex;

justify-content:space-between;

align-items:center;

padding:18px 35px;

backdrop-filter:blur(25px);

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.15);

border-radius:28px;

z-index:999;

box-shadow:0 15px 60px rgba(0,0,0,.3);

}

.logo{

font-size:34px;

font-weight:900;

background:linear-gradient(90deg,#7c3aed,#06b6d4);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.menu{

display:flex;

gap:18px;

}

.menu a{

text-decoration:none;

color:white;

font-weight:600;

padding:12px 22px;

border-radius:18px;

transition:.35s;

}

.menu a:hover{

background:white;

color:#111827;

}

.account{

padding:14px 28px;

border-radius:20px;

background:linear-gradient(90deg,#7c3aed,#2563eb);

color:white;

font-weight:700;

cursor:pointer;

box-shadow:0 10px 30px rgba(124,58,237,.45);

}

/* HERO */

.hero{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding-top:120px;

}

.hero-box{

width:92%;

max-width:1400px;

display:grid;

grid-template-columns:1fr 1fr;

gap:60px;

align-items:center;

}

.hero-left h1{

font-size:78px;

font-weight:900;

line-height:1;

margin-bottom:25px;

}

.hero-left p{

font-size:21px;

opacity:.82;

line-height:1.8;

max-width:650px;

margin-bottom:40px;

}

.hero-buttons{

display:flex;

gap:20px;

flex-wrap:wrap;

}

.btn{

padding:18px 34px;

border-radius:22px;

font-size:18px;

font-weight:700;

cursor:pointer;

transition:.35s;

text-decoration:none;

}

.btn-primary{

background:linear-gradient(90deg,#7c3aed,#2563eb);

color:white;

box-shadow:0 12px 35px rgba(124,58,237,.45);

}

.btn-primary:hover{

transform:translateY(-5px);

}

.btn-secondary{

border:2px solid rgba(255,255,255,.18);

color:white;

backdrop-filter:blur(20px);

}
.btn-secondary:hover{

background:white;

color:#111827;

transform:translateY(-5px);

}

/* ===== Hero Right ===== */

.hero-right{

display:flex;

justify-content:center;

align-items:center;

position:relative;

}

.phone{

width:360px;

height:720px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(30px);

border:1px solid rgba(255,255,255,.18);

border-radius:45px;

overflow:hidden;

box-shadow:

0 25px 80px rgba(0,0,0,.45),

0 0 60px rgba(124,58,237,.25);

position:relative;

animation:floatPhone 6s ease-in-out infinite;

}

@keyframes floatPhone{

50%{

transform:translateY(-15px);

}

}

.phone::before{

content:"";

position:absolute;

top:0;

left:0;

width:100%;

height:180px;

background:linear-gradient(135deg,#7c3aed,#2563eb);

}

.phone-header{

position:absolute;

top:35px;

left:30px;

right:30px;

display:flex;

justify-content:space-between;

font-weight:700;

font-size:18px;

}

.phone-content{

position:absolute;

top:140px;

left:20px;

right:20px;

display:flex;

flex-direction:column;

gap:18px;

}

.music-card{

background:rgba(255,255,255,.12);

backdrop-filter:blur(25px);

border:1px solid rgba(255,255,255,.15);

border-radius:24px;

padding:20px;

display:flex;

align-items:center;

gap:18px;

transition:.35s;

cursor:pointer;

}

.music-card:hover{

transform:scale(1.03);

background:rgba(255,255,255,.18);

}

.album{

width:70px;

height:70px;

border-radius:18px;

background:linear-gradient(135deg,#06b6d4,#7c3aed);

display:flex;

justify-content:center;

align-items:center;

font-size:28px;

}

.song{

flex:1;

}

.song h3{

font-size:19px;

margin-bottom:6px;

}

.song p{

opacity:.75;

font-size:14px;

}

.play{

width:55px;

height:55px;

border-radius:50%;

background:linear-gradient(135deg,#7c3aed,#2563eb);

display:flex;

justify-content:center;

align-items:center;

font-size:22px;

}

/* ===== Floating Balls ===== */

.ball{

position:absolute;

border-radius:50%;

filter:blur(60px);

opacity:.4;

animation:moveBall 8s infinite alternate;

}

.ball1{

width:220px;

height:220px;

background:#7c3aed;

top:-60px;

right:-70px;

}

.ball2{

width:180px;

height:180px;

background:#06b6d4;

bottom:-70px;

left:-60px;

animation-delay:2s;

}

@keyframes moveBall{

100%{

transform:translateY(60px)
translateX(-40px);

}

}
  /* =========================
   FEATURE CARDS
========================= */

.features{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:28px;
padding:80px 8%;
}

.feature-card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(25px);
border:1px solid rgba(255,255,255,.1);
border-radius:32px;
padding:30px;
transition:.4s;
position:relative;
overflow:hidden;
}

.feature-card::before{
content:"";
position:absolute;
width:220px;
height:220px;
background:radial-gradient(circle,#6c63ff55,transparent);
top:-90px;
right:-90px;
}

.feature-card:hover{
transform:translateY(-12px);
border-color:#6c63ff;
box-shadow:0 20px 60px rgba(108,99,255,.25);
}

.feature-icon{
font-size:48px;
margin-bottom:20px;
}

.feature-card h2{
font-size:30px;
margin-bottom:15px;
}

.feature-card p{
opacity:.75;
line-height:1.8;
margin-bottom:25px;
}

.feature-btn{
display:inline-block;
padding:14px 28px;
border-radius:18px;
background:linear-gradient(90deg,#6c63ff,#3c8cff);
color:white;
font-weight:700;
text-decoration:none;
transition:.3s;
}

.feature-btn:hover{
transform:scale(1.05);
box-shadow:0 10px 25px rgba(108,99,255,.4);
}
  /* ===========================
   GLASS FOOTER
=========================== */

.footer{
    margin-top:120px;
    padding:70px 8%;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
    border-top:1px solid rgba(255,255,255,.15);
}

.footer-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:40px;
}

.footer h3{
    color:#fff;
    margin-bottom:20px;
    font-size:22px;
}

.footer p{
    color:rgba(255,255,255,.75);
    line-height:1.8;
}

.footer a{
    display:block;
    color:rgba(255,255,255,.7);
    margin:10px 0;
    text-decoration:none;
    transition:.3s;
}

.footer a:hover{
    color:#7f5cff;
    transform:translateX(8px);
}

.copyright{
    margin-top:60px;
    text-align:center;
    color:rgba(255,255,255,.55);
    border-top:1px solid rgba(255,255,255,.08);
    padding-top:25px;
}

/* ===========================
   Scroll Animation
=========================== */

.hidden{
    opacity:0;
    transform:translateY(60px);
    transition:1s;
}

.show{
    opacity:1;
    transform:translateY(0);
}

/* ===========================
   Beautiful Scrollbar
=========================== */

::-webkit-scrollbar{

}

::-webkit-scrollbar-track{
    background:#111827;
}

::-webkit-scrollbar-thumb{
    background:linear-gradient(180deg,#00c6ff,#7f5cff);
    border-radius:20px;
}

<!-- ================= JAVASCRIPT ================= -->


<script>


// Scroll Animation

const hiddenElements = document.querySelectorAll(".hidden");


const observer = new IntersectionObserver((entries)=>{


entries.forEach(entry=>{


if(entry.isIntersecting){

entry.target.classList.add("show");

}


});


});



hiddenElements.forEach((el)=>observer.observe(el));




// Music Buttons


const buttons = document.querySelectorAll(".play-btn");


buttons.forEach(button=>{


button.addEventListener("click",()=>{


if(button.innerHTML.includes("▶")){


button.innerHTML="⏸ Playing";


}else{


button.innerHTML="▶ Play";


}


});


});



</script>
